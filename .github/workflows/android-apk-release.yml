name: Android APK Release

# Builds the sideload Android APK entirely on GitHub Actions (Expo prebuild +
# local Gradle). Does not submit work to Expo EAS Build.
on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  # arm64-only + modest Gradle heap keeps the runner under RAM pressure while
  # hermesc runs (same knobs as the former free-tier EAS APK path).
  PASEO_APK_LOW_MEM: "1"
  # Install the SDK under the workspace (runner-owned). Free-disk-space deletes
  # the system /usr/local/lib/android tree; setup-android cannot recreate it
  # without root (EACCES mkdir).
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

jobs:
  publish-android-apk:
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # Tag push: build exactly that tag.
      # workflow_dispatch: build the workflow ref (usually main, where the local
      # Gradle scripts live) and still attach the APK to inputs.tag's release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Paseo $RELEASE_TAG"
            --notes ""
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
          fi

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          # Drop large preinstalled toolchains we do not use. Keep the workspace
          # free for our own ANDROID_HOME under $GITHUB_WORKSPACE/.android-sdk.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      # Standard GHA runners (~7–16GB RAM) get SIGTERM mid assembleRelease once
      # Metro/hermesc + native compile peak together; swap absorbs the spike so the
      # job reports a real error instead of "The operation was canceled."
      - name: Enable swap
        shell: bash
        run: |
          set -euo pipefail
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          sudo sysctl -w vm.swappiness=10
          free -h
          swapon --show

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # v4 runs on Node 24 (avoids the Node 20 deprecation path on runners).
      # ANDROID_HOME is workspace-local so this works after free-disk-space removes
      # the system /usr/local/lib/android directory.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          # Match react-native 0.81 pins (libs.versions.toml).
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android APK on runner
        id: build_apk
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_APK_OUTPUT_DIR: ${{ runner.temp }}/android-apk
          ANDROID_APK_OUTPUT_NAME: paseo-${{ env.RELEASE_TAG }}-android.apk
          ANDROID_APK_PATH_FILE: ${{ runner.temp }}/android-apk/path.txt
          # Cap concurrent native/JS work on the runner.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.workers.max=1
            -Dorg.gradle.parallel=false
            -Dkotlin.compiler.execution.strategy=in-process
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          free -h
          df -h
          mkdir -p "$ANDROID_APK_OUTPUT_DIR"
          node scripts/build-github-android-apk.mjs
          apk_path="$(tr -d '\r\n' < "$ANDROID_APK_PATH_FILE")"
          if [[ ! -f "$apk_path" ]]; then
            echo "APK path missing or not a file: $apk_path"
            exit 1
          fi
          # Script also appends to GITHUB_OUTPUT when present; re-assert for clarity.
          echo "asset_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$apk_path")" >> "$GITHUB_OUTPUT"
          ls -lh "$apk_path"
          free -h

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: paseo-${{ env.RELEASE_TAG }}-android-apk
          path: ${{ steps.build_apk.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "${{ steps.build_apk.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"
