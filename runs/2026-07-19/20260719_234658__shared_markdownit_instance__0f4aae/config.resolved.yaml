benchmark:
  environments:
    - chromium_overlay
    - electron_isolated
  freeze_before_candidate_runs: true
  id: desktop_markdown_rendering
  release: v4
  repetitions: 5
  status: released
  workloads:
    cache_states:
      - cold
      - warm
    history:
      heavy_tabs:
        - 1
        - 4
        - 8
      history_items:
        - 50
        - 100
        - 176
    payload_bytes:
      - 65536
      - 262144
      - 1048576
    streaming:
      - plain_unbroken
      - mixed_markdown
      - unclosed_typescript_fence
      - closed_typescript_fence
      - many_short_fences
      - link_table_dense
defaults:
  scale: full
  variant: baseline
entrypoint:
  command: npm run benchmark -- desktop-markdown --output {run_dir}/benchmark.json
  type: shell
eval:
  benchmark: desktop_markdown_rendering
  benchmark_version: v4
  scorer_version: desktop_markdown_metrics_v4
  split: anchor
execution_policy:
  - freeze benchmark release v2 before promoting an implementation candidate
  - change one major variable per branch commit and benchmark run
  - preserve baseline, candidate, and rollback runs under runs/YYYY-MM-DD
  - use only an isolated daemon and isolated Metro/Electron ports
  - never restart, stop, or benchmark against the production daemon on port 6767
  - run targeted tests, typecheck, lint, and format before accepting a candidate
experiment: desktop_markdown_performance
gates:
  correctness:
    - final assistant text and Markdown semantics exactly match the baseline
    - incomplete fences become highlighted immediately after close or turn completion
    - copy returns the complete original code even when rendering is capped or collapsed
    - file links, action links, images, tables, lists, and code actions retain their
      behavior
    - provider epoch, cursor, messageId, and gap handling retain their behavior
    - follow-output, scroll restoration, history paging, and tab re-entry retain their
      behavior
    - running agents, terminals, and subagent tracking retain their behavior
    - browser traffic and WebSockets cannot reach production port 6767
  promotion:
    - primary p95 improves by at least 20 percent
    - relevant Long Task p95 improves by at least 20 percent
    - final-content end-to-end p95 does not regress by more than 5 percent
    - post-GC heap does not regress by more than 10 percent
    - no correctness gate fails on Electron web, browser web, iOS, or Android
hypothesis:
  Paseo Desktop 的 Markdown 性能短板主要来自流式未闭合代码块的重复高亮与 超大单块布局、每条消息重复的解析器和观察器开销，以及无界的高亮缓存；
  通过逐项消融可在保持语义的同时显著降低反馈延迟、Long Task 和内存。
metrics:
  diagnostic:
    - markdown_parse_duration
    - highlight_duration
    - highlight_cache_bytes
    - rendered_token_nodes
    - chunks_per_flush
    - title_body_mismatch_duration
  file: benchmark.json
  primary: feedbackDelay.values.p95
  primary_case: plain_unbroken-1048576-bytes
  secondary:
    - endToEnd.values.p95
    - longTaskDuration.values.p95
    - maxFrameGap.values.p95
    - reactCommits.values.p95
    - postGcHeap.values.p95
    - assistantDomNodes.values.p95
    - axNonIgnoredNodes.values.p95
params:
  measured_switches: 12
  provider_chunk_bytes: 512
  provider_chunk_interval_ms: 1
scale: anchor
status: baseline_ready
variant: shared_markdownit_instance
