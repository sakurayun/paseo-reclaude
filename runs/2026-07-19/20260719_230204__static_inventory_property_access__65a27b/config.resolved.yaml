defaults:
  scale: full
  variant: static_inventory
entrypoint:
  command: npm run benchmark -- desktop-css-interaction-audit --output {run_dir}/benchmark.json
  type: shell
experiment: desktop_css_interactions
gates:
  correctness:
    - visual-only migrated controls preserve focus-visible, keyboard, accessibility,
      and native behavior
    - semantic hover, drag, timers, prefetch, menu-open, and copied/loading state remain
      in JS
  performance:
    - migrated visual hover and active paths cause zero React commits
    - idle feedback p95 is no greater than 16.7ms
    - feedback p95 under the frozen 256KiB stream workload improves by at least 30 percent
  regression:
    - DOM and AX node counts do not increase
    - screenshots match baseline except for intentional transition timing
hypothesis: Moving visual-only Desktop-web hover and active feedback out of React
  state eliminates interaction-only commits and lowers feedback latency while preserving
  semantic JS behavior.
metrics:
  file: benchmark.json
  primary: tasks.0.cases.0.metrics.interactionCallbackSites.values.total
  secondary:
    - tasks.0.cases.0.metrics.interactionStateCells.values.total
    - tasks.0.cases.0.metrics.hoverTrackerPairs.values.total
    - tasks.0.cases.0.metrics.pressPhaseBindings.values.total
scale: full
variant: static_inventory_property_access
