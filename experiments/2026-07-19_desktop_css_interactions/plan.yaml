experiment: desktop_css_interactions
defaults:
  variant: static_inventory
  scale: full
hypothesis: Moving visual-only Desktop-web hover and active feedback out of React state eliminates
  interaction-only commits and lowers feedback latency while preserving semantic JS behavior.
entrypoint:
  type: shell
  commands:
    - npm run benchmark -- desktop-css-interaction-audit --output {run_dir}/static.json
    - npm run benchmark -- desktop-css-interactions --output {run_dir}/runtime.json
metrics:
  files:
    - static.json
    - runtime.json
  primary: runtime.tasks.0.cases.1.metrics.tabRowReactDuration.values.total
  secondary:
    - static.tasks.0.cases.0.metrics.interactionStateCells.values.total
    - static.tasks.0.cases.0.metrics.hoverTrackerPairs.values.total
    - static.tasks.0.cases.0.metrics.pressPhaseBindings.values.total
gates:
  correctness:
    - visual-only migrated controls preserve focus-visible, keyboard, accessibility, and native behavior
    - semantic hover, drag, timers, prefetch, menu-open, and copied/loading state remain in JS
  performance:
    - application-owned visual hover state and parent cascades are removed
    - Electron Button's ordinary-button fast path causes zero React commits on hover
    - idle feedback p95 is no greater than 16.7ms
    - feedback p95 under the frozen 256KiB stream workload improves by at least 30 percent
  regression:
    - DOM and AX node counts do not increase
    - screenshots match baseline except for intentional transition timing
results: results.md
